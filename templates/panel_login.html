<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Girişi | met.code</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background-color: #05050a; color: white; font-family: 'Segoe UI', sans-serif; }
        .glass-panel { background: rgba(20, 20, 25, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden">
    
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-[#a855f7]/20 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="glass-panel p-10 rounded-3xl w-full max-w-md relative z-10 shadow-[0_0_50px_rgba(0,0,0,0.5)] border-t-[#a855f7]/30 border-l-[#a855f7]/30">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-[#a855f7]/20 rounded-full flex items-center justify-center mx-auto mb-4 border border-[#a855f7]/50 shadow-[0_0_15px_rgba(168,85,247,0.5)]">
                <i class="fa-solid fa-fingerprint text-2xl text-[#a855f7]"></i>
            </div>
            <h2 class="text-3xl font-black tracking-widest text-white uppercase">Sistem Girişi</h2>
            <p class="text-gray-400 text-sm mt-2 font-mono">Yetkisiz erişim yasaktır.</p>
        </div>

        {% if hata %}
        <div class="bg-red-500/20 border border-red-500/50 text-red-400 p-3 rounded-xl text-sm mb-6 text-center font-bold">
            <i class="fa-solid fa-triangle-exclamation mr-2"></i> {{ hata }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">Kullanıcı Adı</label>
                <input type="text" name="username" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#a855f7] transition-colors" required>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">Şifre</label>
                <input type="password" name="password" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#a855f7] transition-colors" required>
            </div>
            <button type="submit" class="w-full bg-[#a855f7] text-white font-bold py-4 rounded-xl hover:bg-[#ec4899] transition-all duration-300 shadow-[0_0_20px_rgba(168,85,247,0.4)] mt-2">
                Ağa Bağlan <i class="fa-solid fa-arrow-right-to-bracket ml-2"></i>
            </button>
        </form>
    </div>

</body>
</html>
