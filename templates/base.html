<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Temel SEO Meta Etiketleri -->
    <title>met.code | Yeni Nesil Yazılım Ajansı</title>
    <meta name="description" content="İşletmenizi dijitale taşıyan özel kodlanmış modern web mimarileri, veri analizi çözümleri ve premium dijital vitrinler.">
    <meta name="keywords" content="yazılım, web tasarım, özel yazılım, django, otomasyon, veri bilimi, met.code, metcode">
    <meta name="author" content="met.code">
    <meta name="robots" content="index, follow">

    <!-- OpenGraph (WhatsApp, LinkedIn, Facebook için Paylaşım Kartları) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://met.code/"> <!-- Gerçek domainini alınca burayı değiştirirsin -->
    <meta property="og:title" content="met.code | Dijital Çözüm Ortağınız">
    <meta property="og:description" content="Size özel yazılım mimarileri ve otomasyon sistemleri inşa ediyoruz.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=1200&q=80"> <!-- Paylaşım Resmi -->

    <!-- Twitter Kartları -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="met.code | Yeni Nesil Yazılım Ajansı">
    <meta name="twitter:description" content="Özel yazılım çözümleriyle işletmenizi geleceğe taşıyın.">
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=1200&q=80">

    <!-- Kütüphaneler (Mevcut olanların kalsın) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3262/3262067.png">
     <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#a855f7', /* Neon Mor (Amethyst) */
                        secondary: '#ec4899', /* Canlı Pembe (Magenta) */
                        darkBg: '#05050a',  /* Katran Siyahı (Renklerin patlaması için) */
                        cardBg: 'rgba(15, 15, 20, 0.7)', /* Çok Koyu Buzlu Cam */
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'float-delayed': 'float 6s ease-in-out 3s infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'glow': 'glow 3s alternate infinite'
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' },
                        },
                        glow: {
                            '0%': { boxShadow: '0 0 15px rgba(168,85,247,0.2)' },
                            '100%': { boxShadow: '0 0 35px rgba(168,85,247,0.6)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #05050a; color: white; font-family: 'Segoe UI', system-ui, sans-serif; overflow-x: hidden; }
        
        /* Animasyon Hataları Giderildi */
        .reveal { animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        @keyframes slideUp { 
            0% { opacity: 0; transform: translateY(40px); } 
            100% { opacity: 1; transform: translateY(0); } 
        }
        
        /* Koyu Buzlu Cam Efekti */
        .glass-panel {
            background: rgba(20, 20, 25, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="antialiased selection:bg-secondary selection:text-white relative">

    <!-- Arka Plan Dinamik Neon Işıkları -->
    <div class="fixed top-0 left-1/4 w-96 h-96 bg-primary/20 rounded-full blur-[120px] pointer-events-none z-0 animate-pulse-slow"></div>
    <div class="fixed bottom-0 right-1/4 w-[500px] h-[500px] bg-secondary/15 rounded-full blur-[150px] pointer-events-none z-0 animate-pulse-slow delay-1000"></div>

    <!-- Üst Menü -->
    <nav class="fixed w-full z-50 glass-panel border-b-0 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="{% url 'index' %}" class="text-2xl font-black tracking-tighter text-white hover:scale-105 transition-transform">
                MET<span class="text-primary">.code</span>
            </a>
            <div class="hidden md:flex gap-8 text-sm font-medium text-gray-300">
                <a href="#hakkimizda" class="hover:text-primary hover:-translate-y-0.5 transition-all">Biz Kimiz?</a>
                <a href="#teknolojiler" class="hover:text-primary hover:-translate-y-0.5 transition-all">Altyapımız</a>
                <a href="#projeler" class="hover:text-primary hover:-translate-y-0.5 transition-all">Çözümlerimiz</a>
            </div>
            <a href="#iletisim" class="text-sm font-bold text-white bg-primary px-5 py-2.5 rounded-xl hover:bg-secondary transition-all animate-glow shadow-lg">
                Bize Ulaşın
            </a>
        </div>
    </nav>

    <main class="pt-20 relative z-10">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="py-8 border-t border-white/5 glass-panel text-center relative z-10 mt-12">
        <p class="text-gray-500 text-sm">© 2026 met.code Yazılım Ajansı. Tüm hakları saklıdır.</p>
    </footer>

</body>
</html>
