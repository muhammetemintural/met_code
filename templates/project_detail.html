{% extends 'base.html' %}

{% block title %}Proje İncelemesi | met.code{% endblock %}

{% block content %}
<div class="h-screen flex flex-col pt-20 bg-darkBg overflow-hidden">
    
    <div class="bg-cardBg border-b border-gray-800 px-6 py-4 flex items-center justify-between shrink-0 z-10 shadow-lg">
        <div class="flex items-center gap-6">
            <a href="/" class="text-gray-400 hover:text-white transition-colors flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> <span class="text-sm font-medium">Geri Dön</span>
            </a>
            <div class="h-6 w-px bg-gray-700"></div>
            <div>
                <h1 class="text-white font-bold flex items-center gap-2">
                    Global Retail SaaS <span class="bg-green-500/20 text-green-400 text-[10px] px-2 py-0.5 rounded uppercase tracking-wider">Yayında</span>
                </h1>
                <p class="text-xs text-gray-500 font-mono mt-0.5">https://demo1.metcode.com/retail</p>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <div class="hidden md:flex gap-2">
                <span class="bg-darkBg border border-gray-700 text-gray-300 text-xs px-3 py-1.5 rounded-lg flex items-center gap-2"><i class="fa-brands fa-react text-cyan-400"></i> React</span>
                <span class="bg-darkBg border border-gray-700 text-gray-300 text-xs px-3 py-1.5 rounded-lg flex items-center gap-2"><i class="fa-solid fa-leaf text-green-500"></i> Django</span>
            </div>
            <a href="#" target="_blank" class="bg-primary hover:bg-blue-600 text-white text-sm font-medium px-5 py-2 rounded-lg transition-colors flex items-center gap-2">
                Tam Ekran Aç <i class="fa-solid fa-expand"></i>
            </a>
        </div>
    </div>

    <div class="flex-1 w-full bg-[#0a0e17] p-4 md:p-8 relative">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-3/4 h-3/4 bg-primary/5 rounded-full blur-[150px] pointer-events-none"></div>

        <div class="w-full h-full bg-white rounded-xl shadow-2xl overflow-hidden border border-gray-700 flex flex-col relative z-10">
            <div class="bg-gray-100 border-b border-gray-200 px-4 py-3 flex items-center gap-4 shrink-0">
                <div class="flex gap-1.5">
                    <div class="w-3 h-3 rounded-full bg-red-400"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-400"></div>
                    <div class="w-3 h-3 rounded-full bg-green-400"></div>
                </div>
                <div class="flex-1 bg-white border border-gray-300 rounded-md py-1 px-3 text-xs text-gray-500 font-mono text-center max-w-xl mx-auto flex items-center justify-center gap-2">
                    <i class="fa-solid fa-lock text-[10px] text-green-600"></i> demo.proje.com
                </div>
            </div>

            <iframe src="https://example.com" class="w-full flex-1 border-none bg-white"></iframe>
        </div>
    </div>
</div>
{% endblock %}
