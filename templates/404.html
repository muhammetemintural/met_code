{% extends 'base.html' %}

{% block content %}
<section class="min-h-[80vh] flex items-center justify-center relative z-10 px-6 py-20">
    <div class="absolute inset-0 bg-primary/10 rounded-full blur-[150px] pointer-events-none max-w-md mx-auto"></div>
    
    <div class="text-center space-y-6 relative z-10 glass-panel p-12 rounded-3xl border-white/10 shadow-2xl max-w-xl w-full">
        <!-- Glitch Efektli 404 -->
        <h1 class="text-8xl md:text-9xl font-black text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary drop-shadow-[0_0_15px_rgba(168,85,247,0.5)]">404</h1>
        
        <h2 class="text-2xl md:text-3xl font-bold text-white"><i class="fa-solid fa-triangle-exclamation text-yellow-400 mr-2"></i> Sistemde Kayıp Veri!</h2>
        
        <p class="text-gray-400 leading-relaxed text-sm md:text-base">
            Aradığınız mimari veya proje sunucularımızda bulunamadı. Bağlantı taşınmış veya hiç var olmamış olabilir.
        </p>
        
        <div class="pt-6">
            <a href="{% url 'index' %}" class="inline-flex items-center gap-3 bg-white/5 border border-white/10 hover:border-primary/50 text-white font-bold px-8 py-3.5 rounded-xl transition-all hover:bg-primary/20 hover:-translate-y-1 shadow-lg">
                <i class="fa-solid fa-house"></i> Ana Merkeze Dön
            </a>
        </div>
    </div>
</section>
{% endblock %}
