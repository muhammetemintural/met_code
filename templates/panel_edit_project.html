<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proje Düzenle | met.code Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background-color: #05050a; color: white; font-family: 'Segoe UI', system-ui, sans-serif; }
        .glass-panel { 
            background: rgba(18, 18, 26, 0.65); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.07); 
        }
        .form-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .form-input:focus {
            outline: none;
            border-color: #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.25);
            background: rgba(10, 10, 18, 0.7);
        }
    </style>
</head>
<body class="min-h-screen py-10 px-4 md:px-8 relative overflow-x-hidden">

    <div class="max-w-4xl mx-auto relative z-10 space-y-8">
        
        <div class="glass-panel rounded-2xl p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4 shadow-2xl border-t-white/10">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-blue-500/20 border border-blue-500/40 flex items-center justify-center text-blue-400 shadow-[0_0_20px_rgba(59,130,246,0.3)]">
                    <i class="fa-solid fa-pen-to-square text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold text-white tracking-tight">Proje Güncelleme</h1>
                    <p class="text-xs text-gray-400 mt-0.5">{{ proje.title }} projesini düzenliyorsunuz</p>
                </div>
            </div>
            
            <a href="{% url 'custom_dashboard' %}" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-gray-300 text-xs font-bold border border-white/10 transition-all">
                <i class="fa-solid fa-arrow-left text-xs"></i> İptal ve Dön
            </a>
        </div>

        <form method="POST" enctype="multipart/form-data" class="space-y-8">
            {% csrf_token %}

            <div class="glass-panel p-8 rounded-3xl space-y-6 shadow-xl">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-2 uppercase tracking-wider">Proje Başlığı</label>
                        <input type="text" name="title" value="{{ proje.title }}" required class="form-input w-full rounded-xl px-4 py-3.5 text-sm text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-2 uppercase tracking-wider">Kullanılan Teknolojiler</label>
                        <input type="text" name="technology" value="{{ proje.technology }}" required class="form-input w-full rounded-xl px-4 py-3.5 text-sm text-white font-mono">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-2 uppercase tracking-wider">Proje Açıklaması</label>
                    <textarea name="description" rows="4" required class="form-input w-full rounded-xl px-4 py-3.5 text-sm text-white leading-relaxed resize-none">{{ proje.description }}</textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-2 uppercase tracking-wider">Mevcut / Yeni Görsel</label>
                        {% if proje.image %}
                        <div class="mb-3 w-full h-32 rounded-xl overflow-hidden border border-white/10">
                            <img src="{{ proje.image.url }}" class="w-full h-full object-cover">
                        </div>
                        {% endif %}
                        <input type="file" name="image" accept="image/*" class="form-input w-full rounded-xl px-4 py-2.5 text-xs text-gray-300 file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-purple-600 file:text-white">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-2 uppercase tracking-wider">FontAwesome İkon Kodu</label>
                        <input type="text" name="icon" value="{{ proje.icon }}" class="form-input w-full rounded-xl px-4 py-3.5 text-sm text-white font-mono">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-2 uppercase tracking-wider">Canlı Site URL</label>
                        <input type="url" name="live_link" value="{{ proje.live_link|default:'' }}" class="form-input w-full rounded-xl px-4 py-3.5 text-sm text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-2 uppercase tracking-wider">GitHub Depo URL</label>
                        <input type="url" name="github_link" value="{{ proje.github_link|default:'' }}" class="form-input w-full rounded-xl px-4 py-3.5 text-sm text-white">
                    </div>
                </div>

                <div>
                    <label class="flex items-center gap-3 p-4 rounded-2xl bg-black/30 border border-white/5 cursor-pointer">
                        <input type="checkbox" name="is_active" {% if proje.is_active %}checked{% endif %} class="w-5 h-5 accent-purple-500 rounded">
                        <span class="text-sm font-bold text-white">Vitrinde Yayınla</span>
                    </label>
                </div>
            </div>

            <div class="flex items-center justify-end gap-4">
                <button type="submit" class="bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-extrabold px-10 py-4 rounded-xl shadow-[0_0_30px_rgba(59,130,246,0.4)] transition-all text-sm flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> Değişiklikleri Kaydet
                </button>
            </div>
        </form>

    </div>
</body>
</html>
